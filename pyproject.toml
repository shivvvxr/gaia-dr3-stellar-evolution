[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia-flame-stellar-stage"
version = "1.0.0"
description = "Reproducible analysis of Gaia DR3 FLAME stellar mass versus evolutionary stage"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scipy==1.17.0",
  "scikit-learn==1.8.0",
  "matplotlib==3.10.8",
  "PyMuPDF>=1.24,<2.0",
]

[tool.ruff]
line-length = 100
